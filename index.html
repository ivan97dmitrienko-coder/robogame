<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Робо-Путь</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: manipulation;
      font-family: Arial, sans-serif;
    }
    body {
      background: #0d1b2a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    #game {
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    h1 {
      color: #4cc9f0;
      margin-bottom: 15px;
      font-size: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin: 20px auto;
      max-width: 300px;
    }
    .cell {
      aspect-ratio: 1;
      background: #1b263b;
      border: 2px solid #3a506b;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      cursor: pointer;
      user-select: none;
    }
    .cell.start { background: #e9c46a; }
    .cell.goal { background: #2a9d8f; }
    .cell.robot { background: #f4a261; }
    .controls {
      margin: 20px 0;
    }
    .arrow-btn {
      background: #4cc9f0;
      color: white;
      border: none;
      width: 60px;
      height: 60px;
      font-size: 24px;
      border-radius: 50%;
      margin: 5px;
      cursor: pointer;
    }
    button {
      background: #e76f51;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
    }
    .hidden { display: none; }
    .instructions {
      margin: 15px 0;
      font-size: 15px;
      line-height: 1.4;
    }
    a {
      color: #4cc9f0;
      text-decoration: none;
      display: inline-block;
      margin-top: 15px;
      font-weight: bold;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="game">
    <div id="screen-start">
      <h1>Робо-Путь</h1>
      <div class="instructions">
        Робот застрял! Помоги ему дойти до дома.<br>
        Нажимай на серые плитки, чтобы поставить стрелку.<br>
        Потом жми «Пуск»!
      </div>
      <button id="btn-start">▶ Начать</button>
    </div>

    <div id="screen-game" class="hidden">
      <div class="grid" id="grid"></div>
      <div class="controls">
        <div>
          <button class="arrow-btn" data-dir="↑">↑</button>
        </div>
        <div>
          <button class="arrow-btn" data-dir="←">←</button>
          <button id="btn-run">Пуск!</button>
          <button class="arrow-btn" data-dir="→">→</button>
        </div>
        <div>
          <button class="arrow-btn" data-dir="↓">↓</button>
        </div>
      </div>
    </div>

    <div id="screen-end" class="hidden">
      <h1 id="end-message">Ты помог роботу!</h1>
      <p>Он добрался до дома 🏠</p>
      <a href="https://ваш-сайт.рф?utm_source=bus_qr&utm_medium=logic_game" target="_blank">
        Хочешь решать такие задачки каждую неделю? Запишись на курс!
      </a>
      <button id="btn-restart">Играть снова</button>
    </div>
  </div>

  <script>
    // Уровень: 5x5 сетка
    const level = [
      ['S', '',  '',  '',  ''],
      ['',  '',  'X', '',  ''],
      ['',  'X', '',  '',  ''],
      ['',  '',  '',  'X', ''],
      ['',  '',  '',  '',  'G']
    ];

    let selectedDirection = '→';
    let currentScreen = 'start';
    let robotPos = { x: 0, y: 0 };
    let goalPos = { x: 4, y: 4 };

    const grid = document.getElementById('grid');
    const screenStart = document.getElementById('screen-start');
    const screenGame = document.getElementById('screen-game');
    const screenEnd = document.getElementById('screen-end');
    const endMessage = document.getElementById('end-message');

    // Начало
    document.getElementById('btn-start').onclick = () => {
      screenStart.classList.add('hidden');
      screenGame.classList.remove('hidden');
      currentScreen = 'game';
      renderGrid();
    };

    document.getElementById('btn-restart').onclick = () => {
      screenEnd.classList.add('hidden');
      screenGame.classList.remove('hidden');
      currentScreen = 'game';
      renderGrid();
    };

    // Выбор направления
    document.querySelectorAll('.arrow-btn').forEach(btn => {
      btn.onclick = () => {
        if (currentScreen !== 'game') return;
        selectedDirection = btn.dataset.dir;
        // Визуальная подсветка (опционально)
        document.querySelectorAll('.arrow-btn').forEach(b => b.style.opacity = '0.6');
        btn.style.opacity = '1';
      };
    });

    // Создание сетки
    function renderGrid() {
      grid.innerHTML = '';
      for (let y = 0; y < 5; y++) {
        for (let x = 0; x < 5; x++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          const val = level[y][x];
          if (val === 'S') {
            cell.classList.add('start');
            cell.textContent = '🤖';
            robotPos = { x, y };
          } else if (val === 'G') {
            cell.classList.add('goal');
            cell.textContent = '🏠';
          } else if (val === 'X') {
            cell.style.background = '#1e1e1e';
            cell.style.border = '2px solid #555';
          } else {
            cell.dataset.x = x;
            cell.dataset.y = y;
            cell.onclick = () => {
              if (currentScreen === 'game') {
                cell.textContent = selectedDirection;
                level[y][x] = selectedDirection;
              }
            };
          }
          grid.appendChild(cell);
        }
      }
    }

    // Запуск робота
    document.getElementById('btn-run').onclick = () => {
      if (currentScreen !== 'game') return;
      simulateRobot();
    };

    function simulateRobot() {
      let x = robotPos.x;
      let y = robotPos.y;
      const steps = [];
      const maxSteps = 20;

      for (let i = 0; i < maxSteps; i++) {
        const cell = level[y][x];
        if (cell === 'G') {
          showEnd(true);
          return;
        }
        if (!['↑', '↓', '←', '→'].includes(cell)) break;

        steps.push({ x, y });

        if (cell === '↑') y--;
        if (cell === '↓') y++;
        if (cell === '←') x--;
        if (cell === '→') x++;

        // Проверка границ и препятствий
        if (x < 0 || x >= 5 || y < 0 || y >= 5 || level[y][x] === 'X') {
          break;
        }
      }

      showEnd(false);
    }

    function showEnd(success) {
      currentScreen = 'end';
      screenGame.classList.add('hidden');
      screenEnd.classList.remove('hidden');
      endMessage.textContent = success
        ? '✅ Ура! Робот дома!'
        : '❌ Робот заблудился...';
    }

    // Инициализация
    document.querySelectorAll('.arrow-btn')[2].style.opacity = '1'; // → по умолчанию
  </script>
</body>
</html>
